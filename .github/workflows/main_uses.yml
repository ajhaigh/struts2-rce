name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IQ_SERVER_URL: ${{ secrets.SONATYPE_IQ_URL }}
      LOCAL_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      LOCAL_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      APPLICATION_ID: struts2-rce-gh-ajhaigh
      APPLICATION_VERSION: github_build_${{ github.run_number }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: temurin

      - name: Build with Maven
        run: mvn package

      - name: Nexus IQ for GitHub Actions
        id: evaluate
        uses: ./
        with:
          iq-server-url: ${{ env.IQ_SERVER_URL }}
          username: ${{ env.LOCAL_USERNAME }}
          password: ${{ env.LOCAL_PASSWORD }}
          application-id: ${{ env.APPLICATION_ID }}
          application-version: ${{ env.APPLICATION_VERSION }}
#          enable-reachability: 'true'
#          reachability-namespaces: 'com.xxx.yyy'
