name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IQ_SERVER_URL: https://iq.ahaigh.ngrok.io
      LOCAL_USERNAME: ${{ secrets.STRUTS_USERNAME }}
      LOCAL_PASSWORD: ${{ secrets.STRUTS_SECRET }}
      APPLICATION_ID: struts2-rce-gh-ajhaigh
      APPLICATION_VERSION: github_build_${{ github.run_number }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: temurin

      - name: Build with Maven
        run: mvn package

