name: Nexus IQ Evaluation
description: Run a Sonatype Nexus IQ evaluation for a GitHub Actions workflow.

inputs:
  iq-server-url:
    description: URL of the Nexus IQ Server.
    required: true
  username:
    description: Nexus IQ username. Pass this from a GitHub Actions secret.
    required: true
  password:
    description: Nexus IQ password. Pass this from a GitHub Actions secret.
    required: true
  application-id:
    description: Nexus IQ application ID to evaluate.
    required: true
  application-version:
    description: GitHub build/run number.
    required: true
  stage:
    description: Nexus IQ evaluation stage.
    required: false
    default: Build
  scan-targets:
    description: Path or paths to scan.
    required: false
    default: .
  upload-sarif-file:
    description: Whether to upload a SARIF file.
    required: false
    default: 'true'
  enable-reachability:
    description: Enable Java/JVM Reachability Analysis.
    required: false
    default: 'true'
  reachability-namespaces:
    description: Space-delimited namespaces to scope Reachability Analysis to.
    required: false
    default: ''

outputs:
  scan-id:
    description: Scan id result of the run operation.
    value: ${{ steps.evaluate.outputs.scan-id }}
  report-url:
    description: Link to the analysis report in Lifecycle (IQ Server).
    value: ${{ steps.evaluate.outputs.report-url }}
  cli-exit-code:
    description: Exit code returned by the IQ CLI.
    value: ${{ steps.evaluate.outputs.cli-exit-code }}

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: temurin
  
    - name: Nexus IQ for GitHub Actions
      id: evaluate
      uses: sonatype/actions/evaluate@v1
      with:
        iq-server-url: ${{ inputs['iq-server-url'] }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
        application-id: ${{ inputs['application-id'] }}
        stage: ${{ inputs.stage }}
        scan-targets: ${{ inputs['scan-targets'] }}
        upload-sarif-file: ${{ inputs['upload-sarif-file'] }}
        enable-reachability: ${{ inputs['enable-reachability'] }}
        reachability-namespaces: ${{ inputs['reachability-namespaces'] }}

    - name: Fetch SBOM
      id: fetch-sbom
      if: (success() || failure()) && steps.evaluate.outputs.scan-id
      uses: sonatype/actions/fetch-sbom@v1
      with:
        iq-server-url: ${{ inputs['iq-server-url'] }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
        application-id: ${{ inputs['application-id'] }}
        scan-id: ${{ steps.evaluate.outputs.scan-id }}
        sbom-standard: cyclonedx
        sbom-version: '1.6'
        sbom-format: json
        artifact-name: ${{ inputs['application-id'] }}-sbom

    - name: Upload SBOM to Sonatype IQ
      if: always() && steps.fetch-sbom.outputs.sbom-file-path
      shell: bash
      run: |
        echo "Uploading SBOM to Sonatype IQ..."
        curl -s "${{ inputs['iq-server-url'] }}/api/v2/applications?publicId=${{ inputs['application-id'] }}" \
          -o target/application.json \
          -u "${{ inputs.username }}:${{ inputs.password }}"
        APP_ID=$(jq -r '.applications[0].id' target/application.json)
        echo "AppID: ${APP_ID}"
        curl -s -w "\nHTTP Status: %{http_code}\n" \
          -F "file=@${{ steps.fetch-sbom.outputs.sbom-file-path }}" \
          -F "applicationId=${APP_ID}" \
          -F "applicationVersion=${{ inputs['application-version'] }}" \
          -u "${{ inputs.username }}:${{ inputs.password }}" \
          "${{ inputs['iq-server-url'] }}/api/v2/sbom/import?ignoreValidationError=true" \
          -o response.json
        cat response.json
